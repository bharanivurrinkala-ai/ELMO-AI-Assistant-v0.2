<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELMO AI Assistant</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        :root{
            --bg-gradient:linear-gradient(135deg,#f8fafc 0%,#e2e8f0 100%);
            --chat-bg:#ffffff;
            --text-main:#1e293b;
            --text-muted:#64748b;
            --primary:#6366f1;
            --primary-hover:#4f46e5;
            --bot-bubble:#f1f5f9;
            --user-bubble:#6366f1;
            --user-text:#ffffff;
            --border-light:#f1f5f9;
            --border-subtle:#e2e8f0;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Plus Jakarta Sans',sans-serif;
            background:var(--bg-gradient);
            height:100vh;
        }

        .chat-container{
            width:100%;
            height:100vh;
            display:flex;
            flex-direction:column;
            background:white;
        }

        .chat-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:18px 25px;
            border-bottom:1px solid #e2e8f0;
            background:#fff;
        }

        .header-left{
            display:flex;
            align-items:center;
            gap:15px;
        }

        .logo{
            width:48px;
            height:48px;
            background:#eef2ff;
            border-radius:15px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:22px;
        }

        .chat-header h1{
            font-size:18px;
        }

        .chat-header p{
            font-size:13px;
            color:#64748b;
        }

        .logout-btn{
            background:#ef4444;
            color:white;
            text-decoration:none;
            padding:10px 18px;
            border-radius:10px;
            font-weight:600;
            transition:.3s;
        }

        .logout-btn:hover{
            background:#dc2626;
        }
                .chat-box{
            flex:1;
            overflow-y:auto;
            padding:25px;
            background:#f8fafc;
            display:flex;
            flex-direction:column;
            gap:16px;
        }

        .message{
            max-width:70%;
            padding:14px 18px;
            border-radius:18px;
            line-height:1.6;
            word-wrap:break-word;
            font-size:14px;
        }

        .bot-message{
            background:#ffffff;
            color:#1e293b;
            align-self:flex-start;
            border:1px solid #e2e8f0;
            border-bottom-left-radius:6px;
        }

        .user-message{
            background:#6366f1;
            color:white;
            align-self:flex-end;
            border-bottom-right-radius:6px;
        }

        #selected-file{
            padding:6px 25px;
            font-size:13px;
            color:#6366f1;
            background:#fff;
        }

        .input-area{
            display:flex;
            align-items:center;
            gap:12px;
            padding:18px 25px;
            border-top:1px solid #e2e8f0;
            background:white;
        }

        .upload-btn{
            width:48px;
            height:48px;
            border-radius:14px;
            background:#f1f5f9;
            display:flex;
            justify-content:center;
            align-items:center;
            cursor:pointer;
            font-size:20px;
            border:1px solid #e2e8f0;
            transition:.3s;
        }

        .upload-btn:hover{
            background:#e2e8f0;
        }

        #user-input{
            flex:1;
            height:50px;
            border:1px solid #d1d5db;
            border-radius:14px;
            padding:0 18px;
            font-size:15px;
            outline:none;
        }

        #user-input:focus{
            border-color:#6366f1;
            box-shadow:0 0 0 4px rgba(99,102,241,.15);
        }

        .send-btn{
            width:50px;
            height:50px;
            border:none;
            border-radius:14px;
            background:#6366f1;
            color:white;
            cursor:pointer;
            font-size:18px;
            transition:.3s;
        }

        .send-btn:hover{
            background:#4f46e5;
        }

        .send-btn:active{
            transform:scale(.95);
        }

    </style>
</head>
<body>

<div class="chat-container">

    <!-- Header -->
    <div class="chat-header">

        <div class="header-left">

            <div class="logo">
                🤖
            </div>

            <div>
                <h1>ELMO AI</h1>
                <p>Welcome, {{ username }}</p>
            </div>

        </div>

        <a href="/logout" class="logout-btn">
            🚪 Logout
        </a>

    </div>

    <!-- Chat Box -->
    <div class="chat-box" id="chat-box">

        <div class="message bot-message">

            👋 Hello <b>{{ username }}</b>

            <br><br>

            I am <b>ELMO AI Assistant</b>.

            <br><br>

            I can help you with:

            <br>✅ Coding

            <br>✅ AI & Machine Learning

            <br>✅ PDFs & Documents

            <br>✅ Programming

            <br>✅ General Questions

        </div>

    </div>

    <div id="selected-file"></div>

    <!-- Input Area -->

    <div class="input-area">

        <label for="file-upload" class="upload-btn">
            📁
        </label>

        <input
            type="file"
            id="file-upload"
            hidden
            accept=".pdf,.txt,.doc,.docx"
        >

        <input
            type="text"
            id="user-input"
            placeholder="Type your message..."
        >

        <button
            class="send-btn"
            onclick="sendMessage()">
            ➤
        </button>

    </div>

</div>
<script>

const input=document.getElementById("user-input");

input.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        sendMessage();

    }

});

function addMessage(text,type){

    const chat=document.getElementById("chat-box");

    const div=document.createElement("div");

    div.className="message "+type;

    div.innerHTML=text;

    chat.appendChild(div);

    chat.scrollTop=chat.scrollHeight;

}

async function sendMessage(){

    const input=document.getElementById("user-input");

    const message=input.value.trim();

    if(message==="") return;

    addMessage(message,"user-message");

    input.value="";

    try{

        const response=await fetch("/chat",{

            method:"POST",

            headers:{

                "Content-Type":"application/json"

            },

            body:JSON.stringify({

                message:message

            })

        });

        const data=await response.json();

        addMessage(data.reply,"bot-message");

    }

    catch(error){

        addMessage("Something went wrong.","bot-message");

    }

}
document.getElementById("file-upload").addEventListener("change",async function(){

    if(this.files.length===0) return;

    const file=this.files[0];

    document.getElementById("selected-file").innerHTML=
    "Selected File : "+file.name;

    const formData=new FormData();

    formData.append("file",file);

    try{

        const response=await fetch("/upload",{

            method:"POST",

            body:formData

        });

        const data=await response.json();

        addMessage(data.message,"bot-message");

    }

    catch(error){

        addMessage("Upload failed.","bot-message");

    }

});

</script>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
