<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELMO AI | Sign In</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>

<body>

    <!-- Atmospheric Light AI Background Orbs -->
    <div class="background">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <div class="orb orb-three"></div>
    </div>

    <div class="login-card">

        <!-- Integrated Logo + Brand Name Header -->
        <div class="brand-header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a10 10 0 0 1 7.54 16.54l-1.54 1.46a2 2 0 0 0-.58 1.42v1.58a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-1.58a2 2 0 0 0-.58-1.42l-1.54-1.46A10 10 0 0 1 12 2z"></path>
                    <line x1="9" y1="9" x2="9.01" y2="9"></line>
                    <line x1="15" y1="9" x2="15.01" y2="9"></line>
                    <path d="M10 13h4"></path>
                </svg>
            </div>
            <span class="brand-title">ELMO AI</span>
        </div>

        <div class="header-group">
            <h1>Welcome back</h1>
            <p class="subtitle">Log in to continue your intelligent session</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-message">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    <span>{{ messages[0] }}</span>
                </div>
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST" id="loginForm">

            <div class="input-group">
                <label for="email">Email address</label>
                <div class="input-field-wrapper">
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="name@example.com" 
                        autocomplete="email" 
                        required>
                </div>
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="password">Password</label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <div class="password-box">
                    <input 
                        id="password" 
                        type="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        autocomplete="current-password" 
                        required>
                    <button type="button" id="togglePassword" aria-label="Toggle password visibility">
                        <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox">
                    Remember me for 30 days
                </label>
            </div>

            <button class="login-btn" id="loginButton" type="submit">
                <span>Sign In</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>

        </form>

        <div class="divider">
            <span>or continue with</span>
        </div>

        <a href="{{ url_for('guest') }}" class="guest-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Continue as Guest
        </a>

        <p class="bottom-text">
            Don't have an account? 
            <a href="/register">Create an account</a>
        </p>

    </div>

    <!-- Script for Smooth Password Toggle and State Loading -->
    <script>
        const password = document.getElementById("password");
        const toggle = document.getElementById("togglePassword");

        const eyeOpen = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
        const eyeClosed = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

        toggle.onclick = () => {
            if (password.type === "password") {
                password.type = "text";
                toggle.innerHTML = eyeClosed;
            } else {
                password.type = "password";
                toggle.innerHTML = eyeOpen;
            }
        };

        const form = document.getElementById("loginForm");
        const button = document.getElementById("loginButton");

        form.addEventListener("submit", () => {
            if (form.checkValidity()) {
                button.style.opacity = "0.7";
                button.querySelector("span").textContent = "Signing in...";
            }
        });
    </script>
</body>

</html>
